# Kader — Dependabot: weekly dependency updates + security alerts.
# Best practice: keep the toolchain current and patch known CVEs automatically.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Ljubljana"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Ljubljana"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "ci"
      - "dependencies"