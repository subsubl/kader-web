# Kader — Deploy to self-hosted production server (Hermes / Caddy @ 192.168.64.139:9090).
# Triggers on push to main (after CI), or manually for any branch.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NUXT_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NUXT_PRETIX_WEBHOOK_SECRET: ${{ secrets.PRETIX_WEBHOOK_SECRET }}

      - name: Package release archive
        run: tar -czf release.tar.gz .output package.json nuxt.config.ts

      - name: Push release to deploy API
        if: ${{ env.DEPLOY_URL != '' }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @release.tar.gz \
            --output deploy-response.json
          cat deploy-response.json

      - name: Skip deploy step if DEPLOY_URL not set
        if: ${{ env.DEPLOY_URL == '' }}
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          echo "::warning::DEPLOY_URL secret is not configured in GitHub settings. Skipping server push step."

      - name: Install Supabase CLI
        if: ${{ env.SUPABASE_DB_URL != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push Supabase migrations (production DB)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL"
          supabase gen types typescript --db-url "$SUPABASE_DB_URL" > /tmp/database.ts
          diff -q /tmp/database.ts src/types/database.ts && echo "Types up to date." || echo "::warning::Generated types differ from committed types — run 'supabase gen types typescript' locally and commit."