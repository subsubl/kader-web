name: Refresh RA Events

# Keeps the static site's event data self-refreshing: fetches Resident Advisor
# events server-side (RA blocks cross-origin browser requests, so this cannot be
# done client-side), commits src/data/events.json, and pushes to main which
# redeploys GitHub Pages. Zero-surprise rule: a failed RA fetch exits non-zero
# and pushes nothing, so the previous good snapshot stays deployed.

on:
  schedule:
    - cron: '23 3 * * *' # daily 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch RA events
        run: node scripts/refresh-events.mjs

      - name: Commit if changed
        run: |
          git config user.name "kader-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/events.json
          if git diff --cached --quiet; then
            echo "No event changes since last sync."
          else
            git commit -m "chore(events): refresh RA events snapshot [skip ci]"
            git push
          fi
