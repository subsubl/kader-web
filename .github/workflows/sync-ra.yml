# Scheduled Resident Advisor event sync
# Runs the dependency-free scripts/sync-ra.mjs on a schedule and manually,
# keeping the local `ra_events` table in sync with updated events posted on RA.
#
# Requires repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY

name: Sync RA Events

on:
  schedule:
    # Every 6 hours (RA event changes are infrequent but this keeps lag low)
    - cron: '17 */6 * * *'
  workflow_dispatch: # allow manual run from the Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RA_CLUB_ID: '78778'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run RA event sync
        run: node scripts/sync-ra.mjs